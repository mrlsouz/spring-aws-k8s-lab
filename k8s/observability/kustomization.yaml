apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - kube-state-metrics.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: grafana-dashboard
    namespace: observability
    files:
      - dashboard.json
generatorOptions:
  disableNameSuffixHash: true
