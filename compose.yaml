# Ambiente local completo: API + DynamoDB Local, sem conta AWS.
# Subir:  docker compose up --build
# Parar:  docker compose down
services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    # -inMemory: dados somem ao parar. -sharedDb: uma base só, qualquer credencial/região.
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports:
      - "8000:8000"
    healthcheck:
      # Sem assinatura, o DynamoDB Local responde 400 quando o endpoint está pronto.
      test: ["CMD-SHELL", '[ "$$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)" = 400 ]']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: notes-local
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
    ports:
      - "9090:9090"
    volumes:
      - s3mock-data:/data

  api:
    build: ./app
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      # Dentro da rede do compose, o hostname é o nome do serviço.
      APP_DYNAMODB_ENDPOINT: http://dynamodb:8000
      APP_DYNAMODB_CREATE_TABLE: "true"
    ports:
      - "8080:8080"

volumes:
  s3mock-data:
